<div class="ekran" [class.bright-mode]="isBrightMode">
  <header class="pasek">
    <button class="ikona" type="button" (click)="goBack()" aria-label="Wstecz">
      <img src="assets/images/Back.png" alt="" />
    </button>
    <h1>Lista zakupów</h1>
    <button class="ikona" type="button" (click)="toggleTheme()" aria-label="Zmień motyw">
      <img src="assets/images/Sun.png" alt="" />
    </button>
  </header>

  <div class="obszar lista">
    <p *ngIf="nazwaPrzepisu" class="skad">na: <strong>{{ nazwaPrzepisu }}</strong></p>

    <p *ngIf="brakSkladnikow" class="pusto">
      Lista jest pusta — wejdź tu przyciskiem „Wygeneruj listę zakupów” z przepisu.
    </p>

    <div *ngIf="!brakSkladnikow" class="rzad">
      <p class="postep">{{ kupione }} z {{ ingredients.length }} odhaczonych</p>
      <button class="przycisk-cichy" type="button" (click)="odznaczWszystko()">
        Odznacz wszystko
      </button>
    </div>

    <ul class="skladniki">
      <li *ngFor="let ingredient of ingredients; let i = index">
        <label>
          <input type="checkbox" [checked]="ingredient.checked" (change)="updateCheckedStatus(i)" />
          <span class="nazwa" [class.odhaczony]="ingredient.checked">{{ ingredient.name }}</span>
        </label>
      </li>
    </ul>
  </div>
</div>
