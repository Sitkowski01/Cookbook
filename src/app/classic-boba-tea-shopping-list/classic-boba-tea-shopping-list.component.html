<div class="ekran" [class.bright-mode]="isBrightMode">
  <header class="pasek">
    <button class="ikona" type="button" (click)="goBack()" aria-label="Wstecz">
      <img src="assets/images/Back.png" alt="" />
    </button>
    <h1>Lista zakupów</h1>
    <button class="ikona" type="button" (click)="toggleTheme()" aria-label="Zmień motyw">
      <img src="assets/images/Sun.png" alt="" />
    </button>
  </header>

  <div class="obszar lista">
    <nav class="zakladki" aria-label="Listy">
      <button
        *ngFor="let item of items; let i = index"
        class="filtr"
        type="button"
        [class.wybrany]="isActive(i)"
        (click)="selectItem(i)"
      >
        {{ item }}
      </button>
    </nav>

    <p *ngIf="brakSkladnikow" class="pusto">
      Lista jest pusta — wejdź tu przyciskiem „Generate shopping list” z przepisu.
    </p>

    <p *ngIf="!brakSkladnikow" class="postep">
      {{ kupione }} z {{ ingredients.length }} odhaczonych
    </p>

    <ul class="skladniki">
      <li *ngFor="let ingredient of ingredients; let i = index">
        <label>
          <input type="checkbox" (change)="updateCheckedStatus(i)" />
          <span class="nazwa" [class.odhaczony]="ingredient.checked">{{ ingredient.name }}</span>
        </label>
      </li>
    </ul>
  </div>
</div>
