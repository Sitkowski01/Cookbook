<div class="ekran" [class.bright-mode]="isBrightMode">
  <header class="pasek">
    <button class="ikona" type="button" (click)="goBack()" aria-label="Wstecz">
      <img src="assets/images/Back.png" alt="" />
    </button>
    <h1>Classic Boba Tea</h1>
    <button class="ikona" type="button" (click)="toggleTheme()" aria-label="Zmień motyw">
      <img src="assets/images/Sun.png" alt="" />
    </button>
  </header>

  <div class="obszar przepis">
    <img class="zdjecie" [src]="getBackgroundImageUrl()" alt="Classic Boba Tea" />

    <nav class="zakladki" aria-label="Sekcje przepisu">
      <button
        *ngFor="let item of items; let i = index"
        class="filtr"
        type="button"
        [class.wybrany]="isActive(i)"
        (click)="selectItem(i)"
      >
        {{ item }}
      </button>
    </nav>

    <section class="tresc" *ngIf="isActive(0)">
      <h2>Tea</h2>
      <ul>
        <li *ngFor="let ingredient of doughIngredients">{{ ingredient }}</li>
      </ul>

      <h2>Tapioca</h2>
      <ul>
        <li *ngFor="let ingredient of fillingIngredients">{{ ingredient }}</li>
      </ul>

      <h2>Serving</h2>
      <ul>
        <li *ngFor="let ingredient of servingIngredients">{{ ingredient }}</li>
      </ul>

      <button class="przycisk" type="button" (click)="generateShoppingList()">
        Generate shopping list
      </button>
    </section>

    <section class="tresc" *ngIf="isActive(1)">
      <p class="wstep" *ngFor="let description of generalDescription">{{ description }}</p>

      <h2>Tapioca preparation</h2>
      <ol>
        <li *ngFor="let step of tapiocaPreparationSteps">{{ step }}</li>
      </ol>

      <h2>Tea preparation</h2>
      <ol>
        <li *ngFor="let step of teaPreparationSteps">{{ step }}</li>
      </ol>
    </section>
  </div>
</div>
