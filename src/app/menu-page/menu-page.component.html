<div class="ekran" [class.bright-mode]="motyw.czyJasny()">
  <header class="pasek">
    <button class="ikona" type="button" (click)="motyw.przelacz()" aria-label="Zmień motyw">
      <img src="assets/images/Sun.png" alt="" />
    </button>
    <h1>Cookbook</h1>
    <span></span>
  </header>

  <div class="obszar">
    <p class="pytanie">What would you like to cook?</p>

    <div class="kategorie">
      <a routerLink="/sniadanie" class="kategoria">
        <app-meal mealName="Breakfast" backgroundImageUrl="assets/images/sniadanie.png" />
      </a>
      <a routerLink="/obiad" class="kategoria">
        <app-meal mealName="Dinner" backgroundImageUrl="assets/images/obiad.png" />
      </a>
      <a routerLink="/kolacja" class="kategoria">
        <app-meal mealName="Supper" backgroundImageUrl="assets/images/kolacja.png" />
      </a>
    </div>
  </div>
</div>
